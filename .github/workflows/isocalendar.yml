name: Refresh isometric contribution calendar

on:
  schedule:
    - cron: "45 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/isocalendar.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate full-year isometric calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Qiyuanqiii
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Hong_Kong
          config_display: regular
