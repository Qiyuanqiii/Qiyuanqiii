name: Refresh issue and pull request followup

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/followup.yml

permissions:
  contents: write

concurrency:
  group: refresh-followup-metrics
  cancel-in-progress: false

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate PR and issue lifecycle statistics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.plugin.followup.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: no
          config_timezone: Asia/Hong_Kong
          config_display: regular
