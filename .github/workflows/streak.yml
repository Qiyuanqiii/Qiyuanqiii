name: Refresh contribution streak card

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch streak SVG
        env:
          URL: "https://github-readme-streak-stats-henna-two.vercel.app/?user=Qiyuanqiii&background=FAFAF7&border=D4D1C9&stroke=D4D1C9&ring=3A3D40&fire=A33A2B&currStreakNum=2B2D30&sideNums=2B2D30&currStreakLabel=5B5E61&sideLabels=5B5E61&dates=8B8D90&border_radius=0"
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "[$attempt/6] Fetching streak SVG"
            if curl -sfL --max-time 30 "$URL" > streak.svg.raw 2>/dev/null; then
              sed -n '/<svg/,$p' streak.svg.raw > streak.svg.tmp
              if head -1 streak.svg.tmp | grep -q '^<svg' \
                && grep -Eq 'Current Streak|Total Contributions' streak.svg.tmp; then
                mv streak.svg.tmp streak.svg
                rm -f streak.svg.raw
                echo "Generated streak.svg ($(wc -c < streak.svg) bytes)"
                exit 0
              fi
            fi
            rm -f streak.svg.raw streak.svg.tmp
            sleep 10
          done
          echo "Unable to fetch a valid streak SVG after 6 attempts"
          exit 1

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(stats): refresh streak card"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
