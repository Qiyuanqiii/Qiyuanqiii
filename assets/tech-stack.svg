<svg xmlns="http://www.w3.org/2000/svg" width="900" height="132" viewBox="0 0 900 132" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack</title>
  <desc id="desc">Animated icons for Go, Rust, Python, TypeScript, React, Node.js, Wails, Codex, and Claude Code.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1F2328" flood-opacity=".14"/>
    </filter>
  </defs>
  <style>
    .tile { fill:#F6F8FA; stroke:#D0D7DE; stroke-width:1; }
    .label { fill:#57606A; font:700 11px Verdana, Geneva, DejaVu Sans, sans-serif; text-anchor:middle; letter-spacing:.2px; }
    .bob,.sway,.pulse,.spin { transform-box:fill-box; transform-origin:center; }
    .bob { animation:bob 3.4s ease-in-out infinite; }
    .sway { animation:sway 4.2s ease-in-out infinite; }
    .pulse { animation:pulse 3.6s ease-in-out infinite; }
    .spin { animation:spin 16s linear infinite; }
    .d1 { animation-delay:-.4s; } .d2 { animation-delay:-1.1s; } .d3 { animation-delay:-1.8s; }
    .d4 { animation-delay:-2.5s; } .d5 { animation-delay:-3.2s; }
    @keyframes bob { 0%,100% { transform:translateY(2px) rotate(-1deg); } 50% { transform:translateY(-5px) rotate(1deg); } }
    @keyframes sway { 0%,100% { transform:rotate(-3deg); } 50% { transform:rotate(3deg); } }
    @keyframes pulse { 0%,100% { transform:scale(.96); } 50% { transform:scale(1.05); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-color-scheme:dark) {
      .tile { fill:#161B22; stroke:#30363D; }
      .label { fill:#B1BAC4; }
      .dark-invert { fill:#F0F3F6; }
    }
    @media (prefers-reduced-motion:reduce) {
      .bob,.sway,.pulse,.spin { animation:none; }
    }
  </style>

